# Use Super/Win key, which is typically not used by apps
set $mod Mod4

# Common desktop applications
bindsym           $mod+z                 exec --no-startup-id vivaldi --new-window
bindsym           $mod+Shift+z           exec --no-startup-id vivaldi --new-window --incognito
bindsym           $mod+c                 exec --no-startup-id code --new-window
bindsym           $mod+n                 exec --no-startup-id typora
bindsym           $mod+BackSpace         exec --no-startup-id 1password --quick-access
bindsym           $mod+Shift+BackSpace   exec --no-startup-id raiseorrun com.onepassword.OnePassword
bindsym           $mod+Control+BackSpace exec --no-startup-id pw

# Terminals & TUI utilities
bindsym           $mod+x                 exec --no-startup-id terminal -t
bindsym           $mod+Shift+x           exec --no-startup-id terminal
bindsym           $mod+period            exec --no-startup-id terminal -s 80x40 clac
bindsym           $mod+comma             exec --no-startup-id terminal -t -i yazi
bindsym           $mod+Shift+comma       exec --no-startup-id terminal yazi
bindsym           $mod+s                 exec --no-startup-id terminal pulsemixer
bindsym           $mod+p                 exec --no-startup-id terminal -t htop
bindsym           $mod+Shift+p           exec --no-startup-id terminal htop
bindsym           $mod+Shift+n           exec --no-startup-id terminal quicknote

# System menus
bindsym           $mod+Escape            exec --no-startup-id menu-quit
bindsym           $mod+Return            exec --no-startup-id j4-dmenu-desktop --dmenu="menu" --term="terminal" --i3-ipc --case-insensitive --no-generic
bindsym           $mod+slash             exec --no-startup-id menu-switch
bindsym           $mod+b                 exec --no-startup-id menu-bluetooth
bindsym           $mod+i                 exec --no-startup-id menu-network
bindsym           $mod+d                 exec --no-startup-id menu-autorandr
bindsym           $mod+Shift+d           exec --no-startup-id autorandr --load mobile --force --ignore-lid

# System manipulation
bindsym --release $mod+l                 exec --no-startup-id lock
bindsym --release $mod+Scroll_Lock       exec --no-startup-id lock
bindsym --release $mod+Delete            exec --no-startup-id lock
bindsym --release XF86ScreenSaver        exec --no-startup-id lock

bindsym --release XF86Sleep              exec --no-startup-id loginctl suspend-then-hibernate
bindsym --release XF86Standby            exec --no-startup-id loginctl suspend-then-hibernate
bindsym --release XF86PowerDown          exec --no-startup-id loginctl hibernate
bindsym --release XF86PowerOff           exec --no-startup-id loginctl hibernate

bindsym           $mod+w                 exec --no-startup-id sh -c "SVDIR=$HOME/sv sv restart wallpaper"
bindsym           $mod+o                 exec --no-startup-id sh -c "SVDIR=$HOME/sv sv restart picom"

bindsym           $mod+grave             exec --no-startup-id doas system-pci-rescan
bindsym           $mod+k                 exec --no-startup-id wineserver -k

# Misc actions
bindsym           $mod+Print             exec --no-startup-id screenshot -c
bindsym --release $mod+Shift+Print       exec --no-startup-id screenshot -s -c
bindsym --release $mod+Ctrl+Print        exec --no-startup-id screenshot -s -S -c

bindsym           XF86AudioMute          exec --no-startup-id vol toggle-mute
bindsym           XF86AudioLowerVolume   exec --no-startup-id vol -3%
bindsym           XF86AudioRaiseVolume   exec --no-startup-id vol +3%

bindsym           XF86MonBrightnessUp    exec --no-startup-id xbacklight -inc 5
bindsym           XF86MonBrightnessDown  exec --no-startup-id xbacklight -dec 5

# Preset layouts
bindsym $mod+Ctrl+1 \
  append_layout ~/config/i3/layouts/primary.json;\
  exec --no-startup-id vivaldi --new-window;\
  exec --no-startup-id terminal -t htop;\
  exec --no-startup-id terminal -t -i yazi;\
  exec --no-startup-id terminal -t

bindsym $mod+Ctrl+2 \
  append_layout ~/config/i3/layouts/development.json;\
  exec --no-startup-id code --new-window;\
  exec --no-startup-id terminal -t

bindsym $mod+Ctrl+3 \
  append_layout ~/config/i3/layouts/productivity.json;\
  exec --no-startup-id terminal -t -i yazi;\
  exec --no-startup-id typora;\
  exec --no-startup-id terminal -t

bindsym $mod+Ctrl+4 \
  append_layout ~/config/i3/layouts/terminals.json;\
  exec --no-startup-id terminal -t;\
  exec --no-startup-id terminal -t;\
  exec --no-startup-id terminal -t;\
  exec --no-startup-id terminal -t

bindsym $mod+Ctrl+5 \
  exec --no-startup-id raiseorrun -n com.discordapp.Discord;\
  exec --no-startup-id raiseorrun -n com.slack.Slack;\
  exec --no-startup-id raiseorrun -n weechat
