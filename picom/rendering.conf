# Rendering
backend                   = "glx"  # `xrender`, `glx`, or `xr_glx_hybrid`
vsync                     = true
resize-damage             = 1      # Don't paint this many pixels at the edge of blur
dithered-present          = true
glx-no-stencil            = true
glx-no-rebind-pixmap      = true
glx-use-copysubbuffermesa = true
