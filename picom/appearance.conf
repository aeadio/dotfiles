# Shadows
shadow                  = true
shadow-radius           = 18
shadow-opacity          = 1.00
shadow-offset-x         = -18  # Roughly center the shadow
shadow-offset-y         = -18
shadow-color            = "#000000"
shadow-ignore-shaped    = true
crop-shadows-to-monitor = true

# Transparency
active-opacity   = 1.00
inactive-opacity = 0.98

# Blur
blur-background         = false
blur-background-frame   = false
blur-background-fixed   = false
blur-method             = "none"
blur-strength           = 15

# Fading
fading              = true
fade-in-step        = 0.33
fade-out-step       = 0.15
no-fading-openclose = false
